[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meok-nis2-nl-register-mcp"
version = "1.0.1"
description = "Netherlands NIS2 (Wbni) registration MCP. Generates NCSC-portal-ready (Mijn Organisatie) registration packets for the ~12,000 Dutch orgs in NIS2 scope. Validates org profile, classifies sector + size + entity type per Wbni. Late registration = up to €10M fines + bestuurder liability under Wbni art. 14a. By MEOK AI Labs."
license = {file = "LICENSE"}
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "MEOK AI Labs", email = "nicholas@meok.ai"}]
keywords = ["mcp", "nis2", "wbni", "ncsc", "netherlands", "nederland", "nl", "registratie", "essentiele-entiteit", "belangrijke-entiteit", "compliance", "signed-attestation", "meok-ai-labs"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License", "Operating System :: OS Independent", "Topic :: Security", "Natural Language :: Dutch"]
dependencies = ["mcp>=1.0.0"]

[project.urls]
Homepage = "https://meok.ai/meok-nis2-nl-register-mcp"
Repository = "https://github.com/CSOAI-ORG/meok-nis2-nl-register-mcp"

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = ["server.py"]

[project.scripts]
meok-nis2-nl-register-mcp = "server:main"
